<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Multi Player & Chat Viewer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [mode, setMode] = React.useState('single'); // 'single' or 'triple'
            const [layoutMode, setLayoutMode] = React.useState('auto'); // 'auto', 'portrait', 'landscape'
            const [isPortrait, setIsPortrait] = React.useState(window.innerHeight > window.innerWidth);
            const [url, setUrl] = React.useState('https://www.youtube.com/watch?v=dQw4w9WgXcQ');
            const [videoId, setVideoId] = React.useState('dQw4w9WgXcQ');
            const [chatType, setChatType] = React.useState('mock'); // 'mock' or 'youtube'
            const [chatVisible, setChatVisible] = React.useState(true);

            // 画面サイズの自動検知
            React.useEffect(() => {
                const handleResize = () => {
                    setIsPortrait(window.innerHeight > window.innerWidth);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // URLから動画IDを抽出
            const extractVideoId = (inputUrl) => {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = inputUrl.match(regExp);
                return (match && match[2].length === 11) ? match[2] : 'dQw4w9WgXcQ';
            };

            const handleUrlSubmit = (e) => {
                e.preventDefault();
                setVideoId(extractVideoId(url));
            };

            // 実際のレイアウト判定
            const effectivePortrait = layoutMode === 'auto' ? isPortrait : layoutMode === 'portrait';

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    {/* ヘッダー */}
                    <header className="bg-slate-900 border-b border-slate-800 p-3 flex flex-wrap items-center justify-between gap-2">
                        <div className="flex items-center space-x-2">
                            <h1 className="font-bold text-sm bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
                                YT Multi Viewer
                            </h1>
                            <span className="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300">
                                {effectivePortrait ? '縦長 (動画下チャット)' : '横長 (動画横チャット)'}
                            </span>
                        </div>

                        {/* モード切り替え */}
                        <div className="flex items-center space-x-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
                            <button 
                                onClick={() => setMode('single')}
                                className={`px-3 py-1 rounded transition-colors ${mode === 'single' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}
                            >
                                シングル視聴
                            </button>
                            <button 
                                onClick={() => setMode('triple')}
                                className={`px-3 py-1 rounded transition-colors ${mode === 'triple' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}
                            >
                                縦3画面マルチ
                            </button>
                        </div>

                        {/* レイアウト強制切り替え */}
                        <div className="flex items-center space-x-1 text-xs">
                            <button onClick={() => setLayoutMode('auto')} className={`px-2 py-1 rounded ${layoutMode === 'auto' ? 'bg-slate-700 text-white' : 'text-slate-400'}`}>自動</button>
                            <button onClick={() => setLayoutMode('portrait')} className={`px-2 py-1 rounded ${layoutMode === 'portrait' ? 'bg-slate-700 text-white' : 'text-slate-400'}`}>縦長固定</button>
                            <button onClick={() => setLayoutMode('landscape')} className={`px-2 py-1 rounded ${layoutMode === 'landscape' ? 'bg-slate-700 text-white' : 'text-slate-400'}`}>横長固定</button>
                        </div>
                    </header>

                    {/* URL入力バー (シングルモード時) */}
                    {mode === 'single' && (
                        <form onSubmit={handleUrlSubmit} className="bg-slate-900/50 p-2 border-b border-slate-800 flex gap-2">
                            <input 
                                type="text" 
                                value={url} 
                                onChange={(e) => setUrl(e.target.value)}
                                placeholder="YouTubeのURLを入力 (通常動画・ライブ両対応)"
                                className="flex-1 bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-purple-500"
                            />
                            <button type="submit" className="bg-purple-600 hover:bg-purple-500 text-white px-4 py-1.5 rounded text-xs font-medium">
                                反映
                            </button>
                        </form>
                    )}

                    {/* メインコンテンツ */}
                    <main className="flex-1 overflow-hidden">
                        {mode === 'single' ? (
                            /* シングル視聴モード */
                            <div className={`h-full flex ${effectivePortrait ? 'flex-col' : 'flex-row'}`}>
                                {/* 動画エリア */}
                                <div className={`${effectivePortrait ? 'w-full aspect-video' : 'flex-1 h-full'} bg-black relative`}>
                                    <iframe 
                                        src={`https://www.youtube.com/embed/${videoId}?autoplay=1`}
                                        title="YouTube video player"
                                        className="w-full h-full border-0"
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                        allowFullScreen
                                    ></iframe>
                                </div>

                                {/* チャット・コメントエリア */}
                                <div className={`${effectivePortrait ? 'flex-1 w-full' : 'w-80 h-full'} bg-slate-900 border-t md:border-t-0 md:border-l border-slate-800 flex flex-col`}>
                                    <div className="p-2 border-b border-slate-800 flex justify-between items-center text-xs bg-slate-950">
                                        <div className="flex items-center space-x-2">
                                            <span className="w-2 h-2 rounded-full bg-green-500"></span>
                                            <span className="font-medium text-slate-300">コメント / チャット欄</span>
                                        </div>
                                        <button 
                                            onClick={() => setChatType(chatType === 'mock' ? 'youtube' : 'mock')}
                                            className="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-300 hover:bg-slate-700"
                                        >
                                            {chatType === 'mock' ? '切替: 本番チャット(要ドメイン)' : '切替: モックチャット'}
                                        </button>
                                    </div>

                                    <div className="flex-1 overflow-y-auto p-3 space-y-2 text-xs">
                                        {chatType === 'mock' ? (
                                            <div className="space-y-2 text-slate-300">
                                                <div className="p-2 bg-slate-950 rounded border border-slate-800/60">
                                                    <span className="text-purple-400 font-bold">視聴者A:</span> 通常動画でもライブでもこのエリアにコメント・メモが表示されます！
                                                </div>
                                                <div className="p-2 bg-slate-950 rounded border border-slate-800/60">
                                                    <span className="text-pink-400 font-bold">視聴者B:</span> 縦モニターのときは下に配置され、横長にすると横に並びます。
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="h-full w-full">
                                                <iframe 
                                                    src={`https://www.youtube.com/live_chat?v=${videoId}&embed_domain=${window.location.hostname}`}
                                                    className="w-full h-full border-0"
                                                    title="YouTube Chat"
                                                ></iframe>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* 縦3画面マルチモード */
                            <div className="h-full grid grid-rows-3 gap-1 p-1 bg-slate-950 overflow-y-auto">
                                {[0, 1, 2].map((idx) => (
                                    <div key={idx} className="bg-slate-900 rounded border border-slate-800 flex overflow-hidden min-h-[180px]">
                                        <div className="flex-1 bg-black relative">
                                            <iframe 
                                                src={`https://www.youtube.com/embed/${videoId}?autoplay=0`}
                                                title={`Video ${idx}`}
                                                className="w-full h-full border-0"
                                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                                allowFullScreen
                                            ></iframe>
                                        </div>
                                        <div className="w-48 bg-slate-950 border-l border-slate-800 p-2 flex flex-col text-xs">
                                            <div className="text-slate-400 font-bold mb-1">配信枠 #{idx + 1}</div>
                                            <div className="flex-1 overflow-y-auto text-slate-300 text-[11px] space-y-1">
                                                <p className="text-purple-400">マルチ視聴中</p>
                                                <p>縦
