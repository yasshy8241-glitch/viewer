<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream Vertical Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Twitch Embed API (マルチ音量制御用) -->
  <script src="https://player.twitch.tv/js/embed/v1.js" async></script>
  <style>
    :root {
      --bg-app: #f8fafc;
      --bg-header: #ffffff;
      --bg-panel: #ffffff;
      --bg-sub: #f1f5f9;
      --bg-input: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --border-col: #e2e8f0;
    }
    html.dark {
      --bg-app: #09090b;
      --bg-header: #18181b;
      --bg-panel: #18181b;
      --bg-sub: #09090b;
      --bg-input: #09090b;
      --text-main: #f4f4f5;
      --text-sub: #a1a1aa;
      --text-muted: #71717a;
      --border-col: #27272a;
    }
    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      transition: background-color 0.2s, color 0.2s;
    }
    .theme-header { background-color: var(--bg-header); border-color: var(--border-col); }
    .theme-panel { background-color: var(--bg-panel); border-color: var(--border-col); }
    .theme-sub { background-color: var(--bg-sub); border-color: var(--border-col); }
    .theme-input { background-color: var(--bg-input); border-color: var(--border-col); color: var(--text-main); }
    .theme-border { border-color: var(--border-col); }
    .theme-text { color: var(--text-main); }
    .theme-text-sub { color: var(--text-sub); }
    .theme-text-muted { color: var(--text-muted); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    html.dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden">

  <!-- ==================== トップヘッダー ==================== -->
  <header class="theme-header border-b px-3 py-2 shrink-0 z-20 shadow-sm">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <!-- ロゴ ＆ 現在のレイアウト状態バッジ -->
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-red-500 via-indigo-600 to-purple-600 flex items-center justify-center font-bold text-xs text-white shadow shrink-0">
          ▶
        </div>
        <span class="font-bold text-sm tracking-tight theme-text shrink-0">Stream Vertical Studio</span>
        <span id="layout-status-badge" class="text-[11px] px-2.5 py-0.5 rounded-full border font-medium bg-emerald-500/10 text-emerald-600 border-emerald-500/30 shrink-0">
          📱 縦長 (動画下チャット)
        </span>
      </div>

      <!-- モード・比率・検索・テーマ切替ボタン群 (位置ズレ防止のため要素幅と順序を固定) -->
      <div class="flex flex-wrap items-center justify-end gap-2">
        <!-- アプリ内検索モーダルを開くボタン -->
        <button onclick="openSearchModal()" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition-colors shadow-sm flex items-center gap-1 shrink-0">
          🔍 配信・動画を検索
        </button>

        <!-- 画面比率ロック切替 (マルチ時は消さずに無効化して位置ズレを防止) -->
        <div id="orientation-controls" class="flex items-center theme-sub p-0.5 rounded-lg border text-xs transition-opacity duration-150
