<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream Vertical Studio (YouTube & Twitch)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    };
  </script>
  <!-- React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel (ブラウザ内JSX変換) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Twitch Embed API (マルチ視聴時の音量制御用) -->
  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 3px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #3f3f46;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-zinc-950 dark:text-zinc-100 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const THEME_STORAGE_KEY = 'stream_vertical_studio_theme';

    // ==========================================
    // URL解析ヘルパー: YouTube と Twitch を自動判別
    // ==========================================
    const parseMediaInput = (input) => {
      if (!input || !input.trim()) return null;
      const trimmed = input.trim();

      // 1. Twitch URL 判定
      if (/twitch\.tv/i.test(trimmed)) {
        // Twitch アーカイブ動画 (例: twitch.tv/videos/123456789)
        const videoMatch = trimmed.match(/twitch\.tv\/(?:[a-zA-Z0-9_]+\/v(?:ideo)?\/|videos\/)(\d+)/i);
        if (videoMatch) {
          return { platform: 'twitch', type: 'video', id: videoMatch[1], channel: null };
        }
        // Twitch ライブチャンネル (例: twitch.tv/fps_shaka)
        const channelMatch = trimmed.match(/twitch\.tv\/([a-zA-Z0-9_]+)/i);
        if (channelMatch) {
          return { platform: 'twitch', type: 'channel', id: channelMatch[1].toLowerCase(), channel: channelMatch[1].toLowerCase() };
        }
      }

      // 2. YouTube URL 判定 (watch?v=, youtu.be/, live/, shorts/, embed/)
      const ytRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|live|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
      const ytMatch = trimmed.match(ytRegex);
      if (ytMatch) {
        return { platform: 'youtube', type: 'video', id: ytMatch[1] };
      }

      // 3. ID直接入力時の判定 (11桁ならYouTube、それ以外の英数字ならTwitchチャンネルとして扱う)
      if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) {
        return { platform: 'youtube', type: 'video', id: trimmed };
      }
      if (/^[a-zA-Z0-9_]{3,25}$/.test(trimmed)) {
        return { platform: 'twitch', type: 'channel', id: trimmed.toLowerCase(), channel: trimmed.toLowerCase() };
      }

      return null;
    };

    // YouTube IFrame PlayerへpostMessageで音量・ミュート命令を送信
    const sendYouTubeCommand = (iframeEl, func, args = []) => {
      if (!iframeEl || !iframeEl.contentWindow) return;
      iframeEl.contentWindow.postMessage(
        JSON.stringify({ event: 'command', func, args }),
        '*'
      );
    };

    // ==========================================
    // コンポーネント: 動画プレイヤー (YouTube & Twitch 両対応 + 音量制御)
    // ==========================================
    const UniversalVideoPlayer = ({ media, embedDomain, volume = 100, muted = false }) => {
      const ytIframeRef = useRef(null);
      const twitchContainerRef = useRef(null);
      const twitchPlayerRef = useRef(null);

      // YouTube用の音量反映関数
      const applyYouTubeAudio = (vol, isMuted) => {
        if (!ytIframeRef.current) return;
        if (isMuted || vol === 0) {
          sendYouTubeCommand(ytIframeRef.current, 'mute');
          sendYouTubeCommand(ytIframeRef.current, 'setVolume', [0]);
        } else {
          sendYouTubeCommand(ytIframeRef.current, 'unMute');
          sendYouTubeCommand(ytIframeRef.current, 'setVolume', [vol]);
        }
      };

      // Twitch用の音量反映関数 (Twitch APIは 0.0 〜 1.0)
      const applyTwitchAudio = (vol, isMuted) => {
        const player = twitchPlayerRef.current;
        if (!player) return;
        try {
          if (isMuted || vol === 0) {
            player.setMuted(true);
            player.setVolume(0);
          } else {
            player.setMuted(false);
            player.setVolume(Math.max(0, Math.min(1, vol / 100)));
          }
        } catch (err) {
          // プレイヤー準備前のエラーを無視
        }
      };

      // Twitch Player インスタンスの生成と切り替え
      useEffect(() => {
        if (!media || media.platform !== 'twitch') {
          twitchPlayerRef.current = null;
          return;
        }
        if (!twitchContainerRef.current) return;

        // 既存のDOMをクリア
        twitchContainerRef.current.innerHTML = '';
        twitchPlayerRef.current = null;

        if (window.Twitch && window.Twitch.Player) {
          const options = {
            width: '100%',
            height: '100%',
            parent: [embedDomain],
            autoplay: true,
            muted: muted || volume === 0,
          };
          if (media.type === 'video') {
            options.video = media.id;
          } else {
            options.channel = media.id;
          }

          const player = new window.Twitch.Player(twitchContainerRef.current, options);
          twitchPlayerRef.current = player;

          player.addEventListener(window.Twitch.Player.READY, () => {
            applyTwitchAudio(volume, muted);
          });
        }
      }, [media?.platform, media?.type, media?.id, embedDomain]);

      // 音量・ミュート状態が変化した際にリアルタイム反映
      useEffect(() => {
        if (!media) return;
        if (media.platform === 'youtube') {
          applyYouTubeAudio(volume, muted);
